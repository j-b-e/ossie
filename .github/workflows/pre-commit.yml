name: pre-commit

on:
  pull_request:
  push:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
    - uses: actions/setup-go@v6
      with:
        go-version: "1.24"
    - run: go install golang.org/x/tools/cmd/goimports@latest
    - uses: pre-commit/action@v3.0.1
